services:
  - type: web
    name: fieldcall
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: WEATHER_USER_AGENT
        value: "FieldCall/0.1 (https://github.com/demonchant/amazon-developer-hackathon)"
      - key: FIELDCALL_HOST
        value: 0.0.0.0
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://fieldcall.onrender.com/auth/callback
      - key: SESSION_SIGNING_KEY
        generateValue: true
